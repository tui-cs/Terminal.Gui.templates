name: Build and package

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        job: [package-template, test-template]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # TEMP: while the templates pin the vendored Terminal.Gui 2.5.0 preview from
      # tui-cs/Terminal.Gui PR #5416 (see nuget.config + local_packages/), do NOT overwrite the
      # pins with the latest stable from nuget.org. Re-enable these two steps (remove the
      # `if: false`) when Terminal.Gui 2.5.x ships publicly and the vendored feed is removed.
      - name: Get latest stable Terminal.Gui version
        id: get_version
        if: false  # TEMP — see above
        run: |
          # Pick the latest STABLE Terminal.Gui from NuGet.
          # NOTE: the old selector matched only -alpha/-beta and sorted by the LAST dotted
          # field, so it re-picked 2.0.0-alpha.4309 (build 4309) forever and froze this repo.
          # Filter out every pre-release (anything with a '-') and sort with real semver order.
          url="https://api.nuget.org/v3-flatcontainer/terminal.gui/index.json"
          # select(...) keeps only stable versions (no '-' pre-release suffix); sort -V = semver order.
          latest_version=$(curl -s "$url" | jq -r '.versions[] | select(contains("-") | not)' | sort -V | tail -n 1)
          if [ -z "$latest_version" ]; then
            echo "::error::Could not resolve a stable Terminal.Gui version from NuGet."
            exit 1
          fi
          echo "Latest stable Terminal.Gui: $latest_version"
          echo "latest_version=$latest_version" >> "$GITHUB_OUTPUT"

      - name: Update Terminal.Gui dependency in templates
        if: false  # TEMP — see above
        run: |
          v='${{ steps.get_version.outputs.latest_version }}'
          sed -i "s|\(<PackageVersion>\)[^<]*\(</PackageVersion>\)|\1$v\2|" Terminal.Gui.templates.csproj
          # Bump the Terminal.Gui reference in EVERY template csproj, recursively (covers new
          # templates and nested test projects automatically — no per-template edits needed).
          find templates -name '*.csproj' -print0 | while IFS= read -r -d '' proj; do
            sed -i "s|\(<PackageReference Include=\"Terminal.Gui\" Version=\"\)[^\"]*\(\".*\)|\1$v\2|" "$proj"
          done

      - name: Build and Package Template
        if: matrix.job == 'package-template'
        run: |
          # Pack only the template package project — NOT the solution (the generated app
          # csprojs under templates/ are content, not buildable projects of this package).
          dotnet pack Terminal.Gui.templates.csproj -c Release

      - name: Publish to NuGet
        if: matrix.job == 'package-template' && contains(github.ref, 'refs/tags/v')
        run: dotnet nuget push ./bin/Release/*.nupkg --api-key ${{ secrets.NUGET_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Verify the PUBLISHED package installs from NuGet and works
        if: matrix.job == 'package-template' && contains(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          v='${{ steps.get_version.outputs.latest_version }}'
          idx="https://api.nuget.org/v3-flatcontainer/terminal.gui.templates/index.json"
          echo "Waiting for Terminal.Gui.Templates $v to index on NuGet…"
          for i in $(seq 1 60); do  # up to ~20 min
            if curl -s "$idx" | jq -e --arg v "$v" '(.versions // []) | index($v)' >/dev/null 2>&1; then
              indexed=1; echo "Indexed after ~$((i * 20))s."; break
            fi
            sleep 20
          done
          if [ "${indexed:-}" != 1 ]; then
            # Publish already succeeded; NuGet's indexer being slow isn't our bug — warn, don't fail.
            echo "::warning::$v did not index within the timeout; skipping post-publish smoke test."
            exit 0
          fi
          # Install the JUST-PUBLISHED package from nuget.org and prove it generates + builds —
          # catches "published but broken/unusable for end users" before anyone files a bug.
          dotnet new install "Terminal.Gui.Templates::$v"
          rm -rf /tmp/pub-verify
          dotnet new tui -n PubVerify -o /tmp/pub-verify
          test -f /tmp/pub-verify/AGENTS.md || { echo "::error::published package did not emit AGENTS.md"; exit 1; }
          dotnet build /tmp/pub-verify
          echo "✅ Published Terminal.Gui.Templates $v installs from NuGet and builds."

      - name: Test the template installs, generates, and builds
        if: matrix.job == 'test-template'
        run: |
          set -euo pipefail
          # TEMP: rendered projects land under /tmp, outside the repo tree, so the repo's
          # nuget.config (with the vendored Terminal.Gui 2.5.0 preview feed from
          # tui-cs/Terminal.Gui PR #5416) is not visible to their restores. Drop a nuget.config
          # into each rendered project pointing at the feed by absolute path. Remove this
          # helper (and its call sites) when Terminal.Gui 2.5.x is on nuget.org.
          temp_feed() {
            cat > "$1/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="tgui-pr-5416" value="$GITHUB_WORKSPACE/local_packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          }
          # tui-designer is intentionally not tested/packaged yet (designer snapshot needs
          # regeneration against current Terminal.Gui). Test the packaged template(s).
          for t in tui-simple tui; do
            echo "::group::$t"
            rm -rf "/tmp/$t-test"
            dotnet new install "./templates/$t"
            dotnet new "$t" -n SmokeApp -o "/tmp/$t-test"
            temp_feed "/tmp/$t-test"  # TEMP — see above
            # Verify the agent guidance is emitted (the whole point of these templates).
            for f in AGENTS.md CLAUDE.md .cursorrules .windsurfrules .aider.md; do
              test -f "/tmp/$t-test/$f" || { echo "::error::$t did not emit $f"; exit 1; }
            done
            dotnet build "/tmp/$t-test"
            # The canonical C# in the generated AGENTS.md must compile against the shipped
            # Terminal.Gui — so the embedded guidance can't rot.
            bash scripts/test-doc-snippets.sh "/tmp/$t-test"
            echo "::endgroup::"
          done
          # The flagship's --WithTests path must scaffold a test project whose example tests pass.
          echo "::group::tui --WithTests"
          rm -rf /tmp/with-tests
          dotnet new tui -n WithTestsApp --WithTests -o /tmp/with-tests
          temp_feed /tmp/with-tests  # TEMP — see above
          test -d /tmp/with-tests/Tests || { echo "::error::--WithTests did not emit Tests/"; exit 1; }
          dotnet test /tmp/with-tests/Tests
          echo "::endgroup::"
